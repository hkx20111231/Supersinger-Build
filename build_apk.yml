name: Build Supersinger APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Publish APK
        run: dotnet publish OpenUtau.Android -c Release -r android-arm64 --self-contained true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Supersinger-arm64-APK
          path: OpenUtau.Android/bin/Release/net10.0-android/android-arm64/publish/*.apk
